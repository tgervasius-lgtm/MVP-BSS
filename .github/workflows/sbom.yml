name: BSS dependency inventory

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate frontend CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > bss-frontend-sbom.cdx.json

      - name: Generate backend CycloneDX SBOM
        working-directory: backend
        run: npm sbom --sbom-format=cyclonedx > ../bss-backend-sbom.cdx.json

      - name: Validate generated inventories
        run: |
          node -e "for (const file of ['bss-frontend-sbom.cdx.json','bss-backend-sbom.cdx.json']) { const data=require('./'+file); if (data.bomFormat !== 'CycloneDX' || !Array.isArray(data.components)) throw new Error('Invalid SBOM: '+file); console.log(file+': '+data.components.length+' components'); }"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bss-sbom-${{ github.sha }}
          path: |
            bss-frontend-sbom.cdx.json
            bss-backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
