name: BSS quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: fullstack-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-remediation:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci/backend-dependency-maintenance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Generate and verify exact lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts
          test "$(git diff --name-only)" = "package-lock.json"
          node -e "const p=require('./package-lock.json').packages['node_modules/brace-expansion']; if (p?.version !== '5.0.9') { console.error(p); process.exit(1); }"
          npm audit --audit-level=high

      - name: Commit remediation to this PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "fix(deps): refresh vulnerable transitive lockfile"
          git push origin HEAD:ci/backend-dependency-maintenance

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bss_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bss_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: All dependency audit
        run: npm audit --audit-level=high && npm --prefix backend audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build Cloudflare Pages output
        run: npm run build

      - name: Build backend
        run: npm --prefix backend run build

      - name: Migrate PostgreSQL
        run: npm --prefix backend run migrate:prod
        env:
          NODE_ENV: test
          PUBLIC_ORIGIN: http://127.0.0.1:4173
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bss_e2e
          DATABASE_SSL: "false"

      - name: Bootstrap E2E organization
        run: npm --prefix backend run bootstrap:prod
        env:
          NODE_ENV: test
          PUBLIC_ORIGIN: http://127.0.0.1:4173
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bss_e2e
          DATABASE_SSL: "false"
          BSS_BOOTSTRAP_ORGANIZATION_NAME: BSS E2E d.o.o.
          BSS_BOOTSTRAP_ADMIN_EMAIL: admin-e2e@bss.test
          BSS_BOOTSTRAP_ADMIN_PASSWORD: E2E-secure-password-2026!

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E and axe
        run: npm run test:e2e -- --reporter=line
        env:
          BSS_E2E_FULLSTACK: "true"
          BSS_E2E_BASE_URL: http://127.0.0.1:4173
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: "4173"
          PUBLIC_ORIGIN: http://127.0.0.1:4173
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bss_e2e
          DATABASE_SSL: "false"
          COOKIE_SECURE: "false"
          FRONTEND_ROOT: ../dist
          RFID_UID_PEPPER: e2e-rfid-pepper-0123456789abcdef
          DEVICE_CREDENTIAL_ENCRYPTION_KEY: e2e-device-encryption-key-0123456789abcdef
          TERMINAL_ACTIVATION_CODE: e2e-terminal-activation-code
          BSS_BOOTSTRAP_ADMIN_EMAIL: admin-e2e@bss.test
          BSS_BOOTSTRAP_ADMIN_PASSWORD: E2E-secure-password-2026!
