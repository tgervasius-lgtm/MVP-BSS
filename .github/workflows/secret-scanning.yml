name: BSS secret history scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '7 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks binary
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" gitleaks
          sudo install --mode=0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan complete repository history
        run: |
          set -euo pipefail
          gitleaks git \
            --redact=100 \
            --verbose \
            --log-opts='--all' \
            .
