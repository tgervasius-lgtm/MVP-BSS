name: BSS API and dependency governance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  openapi-lint:
    name: OpenAPI structural validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REDOCLY_TELEMETRY: 'off'
      REDOCLY_SUPPRESS_UPDATE_NOTICE: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.12.0'
      - run: npx --yes @redocly/cli@2.41.1 lint openapi/bss-mvp-api-v1.yaml --config redocly.yaml
