name: BSS API and dependency governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'openapi/**'
      - 'redocly.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/src/http/**'
      - 'backend/src/services/contracts.ts'
      - '.github/workflows/api-dependency-governance.yml'
  push:
    branches: [main]
    paths:
      - 'openapi/**'
      - 'redocly.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/src/http/**'
      - 'backend/src/services/contracts.ts'
      - '.github/workflows/api-dependency-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-dependency-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-lint:
    name: OpenAPI structural validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REDOCLY_TELEMETRY: 'off'
      REDOCLY_SUPPRESS_UPDATE_NOTICE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 22.12
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.12.0'

      - name: Lint BSS OpenAPI contract
        run: npx --yes @redocly/cli@2.41.1 lint openapi/bss-mvp-api-v1.yaml --config redocly.yaml

  dependency-review:
    name: New dependency vulnerability and license review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            CC0-1.0, Unlicense, MPL-2.0, Python-2.0, BlueOak-1.0.0, Zlib
          allow-dependencies-licenses: >-
            pkg:npm/%40fontsource/noto-sans@5.2.10,
            pkg:npm/big-integer@1.6.52
          comment-summary-in-pr: never
          show-openssf-scorecard: true
