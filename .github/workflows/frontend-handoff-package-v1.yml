name: BSS Frontend v1.0.0 Handoff Package

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/build_frontend_handoff_package.py
      - .github/workflows/frontend-handoff-package-v1.yml
  push:
    branches: [main]
    paths:
      - scripts/build_frontend_handoff_package.py
      - .github/workflows/frontend-handoff-package-v1.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: frontend-handoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-immutable-handoff-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout package builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: builder

      - name: Checkout immutable frontend release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: frontend-v1.0.0
          path: release-source

      - name: Build deterministic handoff package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 builder/scripts/build_frontend_handoff_package.py \
            --source release-source \
            --output-dir artifacts \
            | tee artifacts/build-summary.json

      - name: Verify archive and checksum
        run: |
          set -euo pipefail
          unzip -t artifacts/BSS_Frontend_v1.0.0_Handoff.zip
          sha256sum artifacts/BSS_Frontend_v1.0.0_Handoff.zip \
            | tee artifacts/BSS_Frontend_v1.0.0_Handoff.zip.sha256

      - name: Upload verified handoff artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bss-frontend-handoff-v1-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Record verification summary
        run: |
          {
            cat <<'MARKDOWN'
          ## BSS Frontend v1.0.0 Handoff Verification

          - Source: immutable tag frontend-v1.0.0
          - Verification: source contract + ZIP integrity + SHA-256 PASS

          ```json
          MARKDOWN
            cat artifacts/build-summary.json
            cat <<'MARKDOWN'
          ```
          MARKDOWN
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish-verified-handoff-package
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified handoff artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bss-frontend-handoff-v1-${{ github.sha }}
          path: artifacts

      - name: Publish package on the official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view frontend-v1.0.0 \
            --repo tgervasius-lgtm/MVP-BSS
          gh release upload frontend-v1.0.0 \
            artifacts/BSS_Frontend_v1.0.0_Handoff.zip \
            artifacts/BSS_Frontend_v1.0.0_Handoff.zip.sha256 \
            --repo tgervasius-lgtm/MVP-BSS \
            --clobber

      - name: Record publication summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          ## BSS Frontend v1.0.0 Handoff Publication

          - Release: frontend-v1.0.0
          - Asset: BSS_Frontend_v1.0.0_Handoff.zip
          - Verification: immutable source + ZIP integrity + SHA-256 PASS
          MARKDOWN
