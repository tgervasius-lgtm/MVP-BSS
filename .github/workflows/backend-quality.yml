name: BSS backend quality gate

on:
  pull_request:
    paths:
      - "backend/**"
      - "openapi/bss-mvp-api-v1.yaml"
      - "BACKEND_READINESS_REPORT.md"
      - "BACKEND_ARCHITECTURE.md"
      - "BSS_BACKEND_HANDOFF_V1.md"
      - "BACKEND_PHASE_B_REPORT.md"
      - ".github/workflows/backend-quality.yml"
  push:
    branches:
      - main
      - "agent/bss-backend-**"
    paths:
      - "backend/**"
      - "openapi/bss-mvp-api-v1.yaml"
      - "BACKEND_READINESS_REPORT.md"
      - "BACKEND_ARCHITECTURE.md"
      - "BSS_BACKEND_HANDOFF_V1.md"
      - "BACKEND_PHASE_B_REPORT.md"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mailbox-operational:
    name: Mailbox real scanner and synthetic restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked test dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild --foreground-scripts
      - name: Install actual scanner and PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav-daemon clamav-freshclam postgresql-client-16
      - name: Official signatures and isolated local scanner
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/mailbox-clam/db"
          cat > "$RUNNER_TEMP/mailbox-clam/freshclam.conf" <<EOF
          DatabaseDirectory $RUNNER_TEMP/mailbox-clam/db
          DatabaseOwner $(id -un)
          DatabaseMirror database.clamav.net
          MaxAttempts 2
          EOF
          timeout 300 freshclam --config-file="$RUNNER_TEMP/mailbox-clam/freshclam.conf"
          cat > "$RUNNER_TEMP/mailbox-clam/clamd.conf" <<EOF
          DatabaseDirectory $RUNNER_TEMP/mailbox-clam/db
          LocalSocket $RUNNER_TEMP/mailbox-clam/clamd.sock
          LocalSocketMode 600
          ScanPDF yes
          AlertEncryptedDoc yes
          AlertExceedsMax yes
          StreamMaxLength 6M
          MaxFileSize 6M
          MaxScanSize 40M
          MaxRecursion 16
          Foreground yes
          EOF
          clamd --version
          clamd --config-file="$RUNNER_TEMP/mailbox-clam/clamd.conf" > "$RUNNER_TEMP/mailbox-clam/clamd.log" 2>&1 &
          scanner_pid=$!
          for attempt in $(seq 1 60); do
            if [ -S "$RUNNER_TEMP/mailbox-clam/clamd.sock" ]; then exit 0; fi
            if ! kill -0 "$scanner_pid" 2>/dev/null; then cat "$RUNNER_TEMP/mailbox-clam/clamd.log"; exit 1; fi
            sleep 1
          done
          printf 'ClamAV startup timeout after %s attempts\n' "$attempt"
          cat "$RUNNER_TEMP/mailbox-clam/clamd.log"
          exit 1
      - name: Actual scanner and encrypted logical restore proof
        run: |
          umask 077
          export DOCUMENTS_CLAMD_SOCKET="$RUNNER_TEMP/mailbox-clam/clamd.sock"
          node --import tsx --test test/operational/mailbox-runtime.test.ts
        env:
          BSS_MAILBOX_DISPOSABLE_TEST: synthetic-ci-only
          BSS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bss_test

  static-compatibility:
    name: Static compatibility (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.13.0"
            require-case-insensitive: "false"
          - os: windows-latest
            node: "22"
            require-case-insensitive: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Node.js compatibility runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Rebuild required esbuild binary explicitly
        run: npm rebuild esbuild --foreground-scripts
      - name: Verify static file security and native filesystem compatibility
        run: npm run test:static
        env:
          BSS_REQUIRE_CASE_INSENSITIVE: ${{ matrix.require-case-insensitive }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Rebuild required esbuild binary explicitly
        run: npm rebuild esbuild --foreground-scripts

      - name: All dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run lint

      - name: OpenAPI v1 validation
        run: npm run lint:openapi

      - name: Unit and contract tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Compiled migration artifact smoke
        run: npm run migrate:prod
        env:
          NODE_ENV: test
          PUBLIC_ORIGIN: http://127.0.0.1:4173
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bss_test
          DATABASE_SSL: "false"

      - name: PostgreSQL migration and isolation tests
        run: npm run test:integration
        env:
          BSS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/bss_test
          BSS_REQUIRE_POSTGRES_TESTS: "true"
