name: BSS workflow static validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint syntax, expressions and shell validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install verified actionlint binary
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --silent --show-error "$url" --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" actionlint
          sudo install --mode=0755 actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Validate all GitHub Actions workflows
        run: actionlint -color

      - name: Enforce immutable remote action references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          failures: list[str] = []
          uses_pattern = re.compile(r"^\s*uses:\s*([^\s#]+)")
          full_sha = re.compile(r"^[0-9a-f]{40}$")

          for workflow in sorted(Path('.github/workflows').glob('*.y*ml')):
              for line_number, line in enumerate(workflow.read_text(encoding='utf-8').splitlines(), 1):
                  match = uses_pattern.match(line)
                  if not match:
                      continue
                  target = match.group(1)
                  if target.startswith('./'):
                      continue
                  if target.startswith('docker://'):
                      if '@sha256:' not in target:
                          failures.append(f'{workflow}:{line_number}: Docker action nije pinan na sha256 digest: {target}')
                      continue
                  if '@' not in target:
                      failures.append(f'{workflow}:{line_number}: Remote action nema ref: {target}')
                      continue
                  ref = target.rsplit('@', 1)[1]
                  if not full_sha.fullmatch(ref):
                      failures.append(f'{workflow}:{line_number}: Remote action nije pinan na puni commit SHA: {target}')

          if failures:
              print('BSS immutable action reference policy nije prošao:', file=sys.stderr)
              for failure in failures:
                  print(f' - {failure}', file=sys.stderr)
              raise SystemExit(1)

          print('BSS immutable action reference policy: PASS')
          PY
