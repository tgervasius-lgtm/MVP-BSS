openapi: 3.1.0
info:
  title: BSS covered annual leave decisions
  version: 0.3.0
  x-bss-status: INACTIVE_DRAFT
  description: >
    Candidate HTTP contract for submitting and deciding annual leave reservations.
    The standard server does not register these routes. In the opted-in app, the scoped
    GET /leave-requests page has coveredLeaveRequests=true and reservation-backed items
    have coveredWorkflow=true when covered-date reads are enabled. Exception proposals
    require a separate opt-in. Final approval of mixed proposals and additional
    annual entitlement are outside this contract.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://covered-leave.example.invalid/api/v1
    description: Placeholder for the inactive candidate
security:
  - sessionCookie: []
paths:
  /leave-requests/covered-dates:
    post:
      summary: Submit annual leave and reserve the available days
      operationId: submitCoveredLeaveRequest
      x-bss-roles: [worker]
      description: >
        Requires the application origin. The reservation is calculated for each calendar year.
        An insufficient or zero reservation leaves the request pending. Repeating the key with
        the same input returns the existing request. A different input with the same key conflicts.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [startDate, endDate]
              properties:
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                note:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Existing or newly submitted request with the reservation by year.
          headers:
            ETag:
              description: Quoted current request revision.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [requestId, revision, status, years]
                properties:
                  requestId:
                    type: string
                    format: uuid
                  revision:
                    $ref: './bss-mvp-api-v1.yaml#/components/schemas/Revision'
                  status:
                    $ref: './bss-mvp-api-v1.yaml#/components/schemas/RequestStatus'
                  years:
                    $ref: '#/components/schemas/ReservationYears'
        '401':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Forbidden'
        '409':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/ValidationFailed'
        '429':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/RateLimited'
  /leave-requests/{requestId}/covered-dates:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      summary: Read the current covered leave decision
      operationId: getCoveredLeaveDecision
      x-bss-roles: [worker, manager, admin]
      description: >
        Returns the dates on the current revision for the worker who owns the request,
        a manager assigned to the department, or an administrator in the same organization.
        Dates are empty when the current revision has no confirmation or approval.
        The read includes years and eligibleDates. Choices are populated only for the
        requesting worker while the request is pending and that year has a reservation.
      responses:
        '200':
          $ref: '#/components/responses/CoveredDecision'
        '401':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/NotFound'
        '429':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/RateLimited'
  /leave-requests/{requestId}/covered-dates/confirm:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: './bss-mvp-api-v1.yaml#/components/parameters/IfMatch'
    post:
      summary: Confirm covered dates as the requesting worker
      operationId: confirmCoveredLeaveDates
      x-bss-roles: [worker]
      description: >
        Requires the application origin. Submit only workdays within the request and its
        reservation for each calendar year. Saves the selected dates under a new revision
        and leaves the request pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dates]
              properties:
                dates:
                  type: array
                  minItems: 1
                  maxItems: 366
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/CoveredDate'
      responses:
        '200':
          $ref: '#/components/responses/CoveredDecision'
        '401':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/NotFound'
        '409':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/ValidationFailed'
        '429':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/RateLimited'
  /leave-requests/{requestId}/covered-dates/approve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: './bss-mvp-api-v1.yaml#/components/parameters/IfMatch'
    post:
      summary: Approve the confirmed covered dates
      operationId: approveCoveredLeaveDates
      x-bss-roles: [manager, admin]
      description: >
        Requires the application origin and no body. The server uses the dates confirmed
        on the revision named by If-Match. Stale selections, insufficient reservations
        and blocked attendance periods cannot be approved.
      responses:
        '200':
          $ref: '#/components/responses/CoveredDecision'
        '401':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/NotFound'
        '409':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/ValidationFailed'
        '429':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/RateLimited'
  /leave-requests/{requestId}/exception-proposal:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      summary: Read the current exception proposal
      operationId: getAnnualLeaveExceptionProposal
      x-bss-roles: [worker, manager, admin]
      description: >
        Returns only the current pending proposal and confirmation state. Access is
        limited to the submitting worker, a scoped manager or an administrator within
        the company. Internal reasons and grant evidence are omitted.
      responses:
        '200':
          $ref: '#/components/responses/ExceptionProposal'
        '401':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/NotFound'
        '422':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/ValidationFailed'
        '429':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/RateLimited'
    post:
      parameters:
        - $ref: './bss-mvp-api-v1.yaml#/components/parameters/IfMatch'
      summary: Record an exception proposal as a named administrator
      operationId: proposeAnnualLeaveException
      x-bss-roles: [admin]
      description: >
        Requires the application origin, a current named administrator grant and a
        reason. Send every workday as an exact date/type pair. Annual dates must match
        that year's reservation. Remaining dates must use a type allowed by company
        policy. Advances the request revision and leaves it pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dates, reason]
              properties:
                dates:
                  $ref: '#/components/schemas/ExceptionDates'
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '201':
          $ref: '#/components/responses/ExceptionProposal'
        '401':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/NotFound'
        '409':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/ValidationFailed'
        '429':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/RateLimited'
  /leave-requests/{requestId}/exception-proposal/confirm:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      parameters:
        - $ref: './bss-mvp-api-v1.yaml#/components/parameters/IfMatch'
      summary: Confirm the current exception proposal as its submitting worker
      operationId: confirmAnnualLeaveException
      x-bss-roles: [worker]
      description: >
        Requires the application origin and the exact date/type pairs of the proposal
        named by If-Match. Advances the revision and leaves the request pending.
        A replacement proposal must be confirmed again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dates]
              properties:
                dates:
                  $ref: '#/components/schemas/ExceptionDates'
      responses:
        '200':
          $ref: '#/components/responses/ExceptionProposal'
        '401':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/NotFound'
        '409':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/ValidationFailed'
        '429':
          $ref: './bss-mvp-api-v1.yaml#/components/responses/RateLimited'
components:
  securitySchemes:
    sessionCookie:
      $ref: './bss-mvp-api-v1.yaml#/components/securitySchemes/sessionCookie'
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ExceptionProposal:
      description: Exact proposed dates and confirmation state for the current pending request revision.
      headers:
        ETag:
          description: Quoted current request revision.
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            const: no-store, private
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [requestId, revision, proposalRevision, confirmed, dates]
            properties:
              requestId:
                type: string
                format: uuid
              revision:
                $ref: './bss-mvp-api-v1.yaml#/components/schemas/Revision'
              proposalRevision:
                $ref: './bss-mvp-api-v1.yaml#/components/schemas/Revision'
              confirmed:
                type: boolean
              dates:
                $ref: '#/components/schemas/ExceptionDates'
    CoveredDecision:
      description: Current covered decision for the authorized request.
      headers:
        ETag:
          description: Quoted request revision for the next If-Match header.
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            const: no-store, private
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [requestId, revision, status, dates]
            properties:
              requestId:
                type: string
                format: uuid
              revision:
                $ref: './bss-mvp-api-v1.yaml#/components/schemas/Revision'
              status:
                $ref: './bss-mvp-api-v1.yaml#/components/schemas/RequestStatus'
              dates:
                type: array
                uniqueItems: true
                maxItems: 366
                items:
                  $ref: '#/components/schemas/CoveredDate'
              years:
                $ref: '#/components/schemas/ReservationYears'
              eligibleDates:
                type: array
                uniqueItems: true
                items:
                  type: string
                  format: date
  schemas:
    ExceptionDates:
      type: array
      minItems: 1
      maxItems: 366
      uniqueItems: true
      items:
        type: object
        additionalProperties: false
        required: [date, type]
        properties:
          date:
            type: string
            format: date
          type:
            type: string
            enum: [annual_leave, paid_leave, unpaid_leave, free_day]
    ReservationYears:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [year, requestedDays, reservedDays]
        properties:
          year:
            type: integer
          requestedDays:
            type: integer
            minimum: 1
          reservedDays:
            type: integer
            minimum: 0
    CoveredDate:
      type: object
      additionalProperties: false
      required: [date, type]
      properties:
        date:
          type: string
          format: date
        type:
          type: string
          const: annual_leave
